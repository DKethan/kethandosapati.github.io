<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle System Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
        
        button {
            margin: 5px;
            padding: 5px 10px;
            background: #333;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        <h3>Particle System Test</h3>
        <p>Move mouse to interact</p>
        <p>Scroll to see parallax effects</p>
        <div id="stats"></div>
    </div>
    
    <div id="controls">
        <h4>Controls</h4>
        <button onclick="toggleParticles()">Toggle Particles</button>
        <button onclick="changeColorScheme()">Change Colors</button>
        <button onclick="adjustParticleCount()">Adjust Count</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
        import ParticleSystem from './assets/js/3d/ParticleSystem.js';
        import DynamicLighting from './assets/js/3d/DynamicLighting.js';
        import ScrollParallax from './assets/js/3d/ScrollParallax.js';

        let scene, camera, renderer;
        let particleSystem, dynamicLighting, scrollParallax;
        let mouse = new THREE.Vector2();
        let isRunning = true;
        let colorSchemeIndex = 0;
        let particleCount = 1000;

        const colorSchemes = ['default', 'warm', 'cool', 'purple'];

        function init() {
            const container = document.getElementById('container');
            
            // Create scene
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 50, 200);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 30);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 1);
            container.appendChild(renderer.domElement);
            
            // Create particle system
            particleSystem = new ParticleSystem(scene, {
                particleCount: particleCount,
                particleSize: 0.1,
                particleSpeed: 0.01,
                particleRange: 50,
                particleOpacity: 0.6,
                scrollInfluence: 0.5,
                mouseInfluence: 1.0
            });
            
            // Create dynamic lighting
            dynamicLighting = new DynamicLighting(scene, {
                ambientIntensity: 0.4,
                directionalIntensity: 0.8,
                accentIntensity: 0.5,
                mouseInfluence: 2.0,
                scrollInfluence: 0.3
            });
            
            // Create scroll parallax
            scrollParallax = new ScrollParallax({
                smoothness: 0.1,
                particleInfluence: 0.5,
                lightingInfluence: 0.2
            });
            
            // Register elements for parallax
            scrollParallax.registerElement('particles', particleSystem, 'particles', {
                container: document.body,
                influence: 0.5
            });
            
            scrollParallax.registerElement('lighting', dynamicLighting, 'lighting', {
                container: document.body,
                influence: 0.2
            });
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            
            // Start animation loop
            animate();
            
            console.log('Particle system test initialized');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function animate() {
            if (!isRunning) return;
            
            requestAnimationFrame(animate);
            
            const deltaTime = 16.67; // Approximate 60fps
            const scrollY = window.pageYOffset || document.documentElement.scrollTop;
            
            // Update systems
            if (particleSystem) {
                particleSystem.update(deltaTime, mouse.x, mouse.y);
            }
            
            if (dynamicLighting) {
                dynamicLighting.update(deltaTime, mouse.x, mouse.y, scrollY);
            }
            
            if (scrollParallax) {
                scrollParallax.update(deltaTime);
            }
            
            // Update stats
            updateStats();
            
            // Render
            renderer.render(scene, camera);
        }

        function updateStats() {
            const stats = document.getElementById('stats');
            stats.innerHTML = `
                <small>
                Mouse: ${mouse.x.toFixed(2)}, ${mouse.y.toFixed(2)}<br>
                Particles: ${particleCount}<br>
                Scroll: ${scrollParallax ? scrollParallax.getCurrentScroll().toFixed(0) : 0}
                </small>
            `;
        }

        // Control functions
        window.toggleParticles = function() {
            isRunning = !isRunning;
            if (isRunning) {
                animate();
            }
        };

        window.changeColorScheme = function() {
            if (dynamicLighting) {
                colorSchemeIndex = (colorSchemeIndex + 1) % colorSchemes.length;
                dynamicLighting.setColorScheme(colorSchemes[colorSchemeIndex]);
                console.log('Changed to color scheme:', colorSchemes[colorSchemeIndex]);
            }
        };

        window.adjustParticleCount = function() {
            particleCount = particleCount === 1000 ? 500 : particleCount === 500 ? 2000 : 1000;
            if (particleSystem) {
                particleSystem.setParticleCount(particleCount);
                console.log('Particle count changed to:', particleCount);
            }
        };

        // Initialize when page loads
        init();
    </script>
</body>
</html>
