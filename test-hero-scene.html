<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Scene Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      font-family: Arial, sans-serif;
    }
    
    .test-hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    .test-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }
    
    .test-content h1 {
      font-size: 3rem;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .test-content p {
      font-size: 1.2rem;
      margin: 1rem 0;
      opacity: 0.9;
    }
    
    .status {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 1000;
    }
  </style>
  
  <!-- 3D Libraries -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="status" id="status">Initializing...</div>
  
  <section class="test-hero" id="testHero">
    <div class="test-content">
      <h1>Hero Scene Test</h1>
      <p>Testing basic 3D hero scene implementation</p>
      <p>Move your mouse to see camera interaction</p>
    </div>
  </section>

  <script type="module">
    import HeroScene from './assets/js/3d/HeroScene.js';
    
    const status = document.getElementById('status');
    
    function updateStatus(message) {
      status.textContent = message;
      console.log(message);
    }
    
    async function testHeroScene() {
      try {
        updateStatus('Creating 3D container...');
        
        const heroSection = document.getElementById('testHero');
        
        // Create 3D container
        const canvas3DContainer = document.createElement('div');
        canvas3DContainer.style.cssText = `
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          z-index: 1;
        `;
        
        heroSection.insertBefore(canvas3DContainer, heroSection.firstChild);
        
        updateStatus('Initializing HeroScene...');
        
        // Create hero scene
        const heroScene = new HeroScene(canvas3DContainer, {
          fov: 75,
          near: 0.1,
          far: 1000
        });
        
        updateStatus('Starting animation loop...');
        
        // Animation loop
        function animate() {
          const deltaTime = 16.67; // ~60fps
          heroScene.update(deltaTime);
          heroScene.render();
          requestAnimationFrame(animate);
        }
        
        animate();
        
        updateStatus('Hero Scene running successfully! Move your mouse around.');
        
        // Test scene disposal after 30 seconds
        setTimeout(() => {
          updateStatus('Testing scene disposal...');
          heroScene.dispose();
          updateStatus('Scene disposed successfully!');
        }, 30000);
        
      } catch (error) {
        updateStatus(`Error: ${error.message}`);
        console.error('Hero Scene test failed:', error);
      }
    }
    
    // Start test when page loads
    document.addEventListener('DOMContentLoaded', testHeroScene);
  </script>
</body>
</html>
